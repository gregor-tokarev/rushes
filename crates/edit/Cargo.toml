[package]
name = "rushes-edit"
description = "Rushes' own AI editing tools: transcription, cut plans, rendering and checks, served to a coding agent over MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "3"

[dev-dependencies]
tempfile = "3"
