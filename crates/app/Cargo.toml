[package]
name = "rushes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-signal = "0.2"
chrono = "0.4"
futures = "0.3"
gpui-kit.workspace = true
# Only to read the error codes in rushes-core's StoreError; same features as core.
rusqlite = { version = "0.40", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
rushes-core = { path = "../core" }
rushes-pipeline = { path = "../pipeline" }
rushes-update = { path = "../update" }
rushes-youtube = { path = "../youtube" }

[dev-dependencies]
base64 = "0.22"
gpui-kit = { workspace = true, features = ["test-support"] }
sha2 = "0.10"
tempfile = "3"
url = "2"
