[package]
name = "videocrm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4"
futures = "0.3"
gpui-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
videocrm-core = { path = "../core" }
videocrm-pipeline = { path = "../pipeline" }
videocrm-youtube = { path = "../youtube" }

[dev-dependencies]
base64 = "0.22"
gpui-kit = { workspace = true, features = ["test-support"] }
sha2 = "0.10"
tempfile = "3"
url = "2"
