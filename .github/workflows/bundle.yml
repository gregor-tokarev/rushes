# Builds the macOS and Linux bundles of VideoCRM, starts each once to check that it
# opens a window, installs each over an older copy the way the app updates itself, and
# publishes them:
#   - a tag v<version> (matching the workspace version) creates a GitHub release with them,
#     whether it was pushed or the Daily release workflow made it and calls this one;
#   - a manual run, or a pull request that touches the bundling or the updater, keeps them
#     as run artifacts.
name: Bundle

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/bundle.yml
      - scripts/bundle-*.sh
      - assets/icon.svg
      - crates/update/**
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The tag to build and release, v<version>
        type: string
        required: true

concurrency:
  group: bundle-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - id: version
        name: Version from the workspace (and the tag)
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "$TAG" ]]; then
            version=${TAG#v}
            if [[ "$version" != "$crate" ]]; then
              echo "::error::Tag $TAG doesn't match the workspace version $crate in Cargo.toml."
              exit 1
            fi
          else
            version=$crate-dev.${COMMIT::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The oldest macOS GPUI's Metal shaders support.
      MACOSX_DEPLOYMENT_TARGET: "10.15.7"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - name: Metal toolchain
        # GPUI compiles its shaders with `xcrun metal`; newer Xcode ships it separately.
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Build
        run: |
          cargo build --release --locked -p videocrm --target aarch64-apple-darwin
          cargo build --release --locked -p videocrm --target x86_64-apple-darwin

      - name: Bundle
        run: |
          brew install librsvg
          scripts/bundle-macos.sh "$VERSION" \
            target/aarch64-apple-darwin/release/videocrm \
            target/x86_64-apple-darwin/release/videocrm
          lipo -info target/bundle/VideoCRM.app/Contents/MacOS/videocrm

      - name: Smoke test (opens the app from the disk image)
        run: |
          dmg=$(ls target/bundle/*.dmg)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/videocrm-dmg
          open -n /tmp/videocrm-dmg/VideoCRM.app
          sleep 20
          mkdir -p smoke
          screencapture -x smoke/macos.png || echo "::warning::screencapture failed"
          if ! pgrep -x videocrm; then
            echo "::error::VideoCRM quit within 20 s of starting."
            exit 1
          fi
          osascript -e 'quit app "VideoCRM"' || pkill -x videocrm
          sleep 3
          hdiutil detach /tmp/videocrm-dmg || hdiutil detach -force /tmp/videocrm-dmg

      - name: Updater test (installs the disk image over an older app)
        env:
          VIDEOCRM_UPDATE_TEST_BUNDLES: ${{ github.workspace }}/target/bundle
          VIDEOCRM_UPDATE_TEST_VERSION: ${{ env.VERSION }}
        run: cargo test --locked -p videocrm-update

      - uses: actions/upload-artifact@v7
        with:
          name: videocrm-macos
          path: target/bundle/*.dmg
          if-no-files-found: error
          # A release keeps its own copy; the Actions storage quota is small.
          retention-days: ${{ needs.version.outputs.tag != '' && 1 || 7 }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-macos
          path: smoke/
          if-no-files-found: ignore

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest supported Ubuntu sets the glibc floor of the binary.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev libssl-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            librsvg2-bin desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - name: Build
        run: cargo build --release --locked -p videocrm

      - name: Bundle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            scripts/bundle-linux.sh "$VERSION" target/release/videocrm

      - name: Updater test (installs the AppImage and the tarball over older copies)
        env:
          VIDEOCRM_UPDATE_TEST_BUNDLES: ${{ github.workspace }}/target/bundle
          VIDEOCRM_UPDATE_TEST_VERSION: ${{ env.VERSION }}
        run: cargo test --locked -p videocrm-update

      - uses: actions/upload-artifact@v7
        with:
          name: videocrm-linux
          path: |
            target/bundle/*.tar.gz
            target/bundle/*.AppImage
          if-no-files-found: error
          # A release keeps its own copy; the Actions storage quota is small.
          retention-days: ${{ needs.version.outputs.tag != '' && 1 || 7 }}

  linux-smoke:
    name: Linux smoke test
    needs: [version, linux]
    # A newer distribution than the build's: the bundle must run there too, and its
    # Mesa software renderer presents frames under Xvfb (22.04's stays black).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: videocrm-linux
          path: dist

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils imagemagick mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0

      - name: Start the AppImage under Xvfb
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          mkdir -p smoke
          appimage=$PWD/dist/VideoCRM-$VERSION-x86_64.AppImage
          chmod +x "$appimage"
          # No FUSE on the runner: run the AppImage's own contents.
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          VIDEOCRM_DATA_DIR="$RUNNER_TEMP/data" "$RUNNER_TEMP/squashfs-root/AppRun" > smoke/linux.log 2>&1 &
          app=$!
          sleep 20
          import -window root smoke/linux.png
          fail() { echo "::error::$1"; cat smoke/linux.log; exit 1; }
          kill -0 "$app" || fail "VideoCRM quit within 20 s of starting."
          xwininfo -root -tree | grep -q '"VideoCRM"' || fail "VideoCRM is running but has no window."
          # The onboarding screen is mostly light; a blank (black) screen means nothing rendered.
          brightness=$(convert smoke/linux.png -format '%[fx:mean]' info:)
          echo "Mean brightness: $brightness"
          awk -v b="$brightness" 'BEGIN { exit !(b > 0.2) }' || fail "VideoCRM's window is blank."
          kill -TERM "$app"
          wait "$app"
          tar -tzf dist/videocrm-"$VERSION"-linux-x86_64.tar.gz > /dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-linux
          path: smoke/
          if-no-files-found: ignore

  release:
    name: Release
    if: needs.version.outputs.tag != ''
    needs: [version, macos, linux, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: videocrm-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "VideoCRM ${{ needs.version.outputs.version }}" \
            --generate-notes
